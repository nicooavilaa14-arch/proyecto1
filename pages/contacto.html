     <main class="contacto">
       <h1>Contacto</h1> 
       <p class="textocontacto">
        ¿Tenes alguna consulta? Completa el formulario y nos pondremos en contacto con vos.
       </p>
       <div class="contactocontenido">
       <!-- MAPA -->
        <div class="mapa">
            <h2>Encontranos</h2>
            <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3560.106067949496!2d-65.20974192528035!3d-26.836578490025605!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x94225d3ad7f30f1d%3A0xf8606cd659b8e3e4!2sRollingCode%20School!5e0!3m2!1ses-419!2sar!4v1790285014517!5m2!1ses-419!2sar" width="500" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
        </div>
        <!-- FORMULARIO -->
         <div class="formulario">
            <h2>Envianos tu consulta</h2>
            <form action="">
                <label for="nombre">Nombre</label>
            <input type="text" id="nombre" placeholder="Tu nombre" minlength="3" required>
            <label for="email">Correo electronico</label>
            <input type="email" id="email" placeholder="Tu correo" pattern=".+@gmail.com" title="ingresa un correo con gmail.com" required>
            <label for="mensaje">Consulta</label>
            <textarea name="mensaje" id="mensaje" placeholder="Escribi tu consulta..." minlength="5" required></textarea>
            <button type="submit">Enviar consulta</button>
            </form>
         </div> 
       </div>
     </main>
     <!-- fin contacto -->
</body>
